name: Bot theo xu hướng (khung ngày)

# Luật tính trên NẾN NGÀY, nhưng chạy mỗi giờ:
#   • quyết định vào/ra chỉ xảy ra khi nến ngày vừa đóng (07:00 giờ VN)
#   • những giờ còn lại chỉ canh, báo khi giá thủng ngưỡng thoát ngay trong ngày
# Không đặt lệnh, không giữ khoá API sàn.

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi thử tin mẫu kèm ảnh (nhập mã, vd BTC). Để trống = chạy thật."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: trend-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Pillow để vẽ chart
        run: pip install --quiet pillow

      - name: Chạy bot xu hướng
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Đặt lệnh trên TESTNET (tiền ảo): bật bằng Variable LIVE_TRADING=testnet.
          # Actions chỉ được chạy testnet — api.binance.com chặn IP Mỹ của GitHub và
          # không khoá key theo IP được. Tiền thật phải chạy trên máy riêng.
          LIVE_TRADING: ${{ vars.LIVE_TRADING == 'testnet' && 'testnet' || 'off' }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
          LIVE_STATE: data/live-trend.json
          # Tuỳ chọn: thêm secret này nếu muốn bot xu hướng gửi vào chat riêng.
          # Không có thì nó gửi chung chat với bot bắt đáy.
          TELEGRAM_CHAT_ID_TREND: ${{ secrets.TELEGRAM_CHAT_ID_TREND }}
        run: |
          if [ -n "${{ github.event.inputs.test }}" ]; then
            python scripts/trend_bot.py --test "${{ github.event.inputs.test }}"
          else
            python scripts/trend_bot.py --no-send    # sổ giấy chỉ ghi file cho trang web; tin Telegram do bot trên VPS gửi
          fi

      # Chỉ commit khi nến ngày đóng và có lệnh vào/ra, không commit mỗi giờ.
      - name: Commit sổ khi có lệnh vào hoặc ra (giấy và testnet)
        if: github.event.inputs.test == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/cache/trend-events.flag ]; then
            git add data/trend-ideas.json
          fi
          # Sổ lệnh testnet: commit khi có thay đổi thật (bỏ qua dòng updatedAt đổi mỗi giờ).
          if [ -f data/live-trend.json ] && { ! git ls-files --error-unmatch data/live-trend.json >/dev/null 2>&1 || ! git diff --quiet -I '"updatedAt"' -- data/live-trend.json; }; then
            git add data/live-trend.json
          fi
          if git diff --cached --quiet; then
            echo "Không có lệnh vào/ra."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "Sổ xu hướng $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
