name: Cập nhật dữ liệu phân tích

on:
  schedule:
    # 09:30 UTC = 16:30 giờ Việt Nam, thứ Hai → thứ Sáu (sau phiên ATC 14:45)
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tầng 1 — quét cả sàn (VNALL + HNX30), lọc thanh khoản, chọn shortlist
      - name: Quét sàn
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/scan.py

      # Tầng 2 — chấm điểm đầy đủ cho VN30 + mã khai báo tay + shortlist của tầng 1
      - name: Chấm điểm và lập kế hoạch giá
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/fetch_ssi.py

      - name: Quét tín hiệu và gửi Telegram
        env:
          PYTHONIOENCODING: utf-8
          # Hai secret này là tuỳ chọn. Không có thì bot chỉ ghi file cho trang web
          # đọc, không gửi tin. Bot không đặt lệnh nên ở đây không có và không được
          # đặt bất kỳ khoá API giao dịch nào.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/signals.py

      # Tầng 3 — sổ theo dõi: mở ý tưởng khi có điểm buy, theo dõi tới điểm sell
      - name: Cập nhật sổ theo dõi ý tưởng
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ideas.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
            exit 0
          fi
          DATE=$(python -c "import json;print(json.load(open('data/analysis.json',encoding='utf-8'))['dataDate'])")
          git commit -m "Dữ liệu phân tích phiên $DATE"
          git push
