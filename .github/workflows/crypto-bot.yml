name: Bot tín hiệu crypto

# Quét các cặp thanh khoản nhất mỗi khi nến 4h đóng, mở vị thế GIẤY khi có tín hiệu,
# theo dõi tới khi chạm cắt lỗ / chốt lời / trailing / hết hạn giữ, rồi báo điểm bán.
# Không đặt lệnh, không giữ khoá API sàn — chỉ có token Telegram để gửi tin.

# Từ 26/10/2026 bot chạy trên VPS (Binance chặn IP của GitHub): VPS ghi cả sổ giấy lẫn
# lệnh trên sàn rồi đẩy lên repo. Workflow này chỉ còn để GỬI THỬ tin mẫu bằng tay —
# không chạy theo lịch, không ghi sổ, để không giẫm lên sổ do VPS đẩy lên.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi thử tin mẫu kèm ảnh — nhập một hoặc nhiều mã, vd: btc  hoặc  ltc,ada,avax,dot. Để trống = quét thật."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow chỉ để vẽ ảnh chart gửi kèm tín hiệu. Thiếu nó thì bot vẫn chạy,
      # chỉ gửi tin chữ.
      - name: Cài Pillow để vẽ chart
        run: pip install --quiet pillow

      - name: Quét tín hiệu crypto
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Đặt lệnh trên TESTNET (tiền ảo): bật bằng Variable LIVE_TRADING=testnet.
          # Actions chỉ được chạy testnet — api.binance.com chặn IP Mỹ của GitHub và
          # không khoá key theo IP được. Tiền thật phải chạy trên máy riêng.
          LIVE_TRADING: ${{ vars.LIVE_TRADING == 'testnet' && 'testnet' || 'off' }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
          LIVE_DIP_STATE: data/live-dip.json
        run: |
          if [ -n "${{ github.event.inputs.test }}" ]; then
            python scripts/crypto_bot.py --test "${{ github.event.inputs.test }}"
          else
            echo "Sổ giấy giờ chạy trên VPS. Nhập mã vào ô test để gửi thử tin mẫu."
          fi

      # Chạy mỗi giờ nên chỉ commit khi thực sự có lệnh vào hoặc ra, không commit
      # mỗi lần giá vị thế đang mở nhúc nhích.
      - name: Commit sổ khi có lệnh vào hoặc ra (giấy và testnet)
        if: false   # VPS đẩy sổ lên repo; workflow này không ghi sổ nữa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/cache/events.flag ]; then
            git add data/crypto-ideas.json
          fi
          # Sổ lệnh testnet: commit khi có thay đổi thật (bỏ qua dòng updatedAt đổi mỗi giờ).
          if [ -f data/live-dip.json ] && { ! git ls-files --error-unmatch data/live-dip.json >/dev/null 2>&1 || ! git diff --quiet -I '"updatedAt"' -- data/live-dip.json; }; then
            git add data/live-dip.json
          fi
          if git diff --cached --quiet; then
            echo "Không có lệnh vào/ra."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "Sổ crypto $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
