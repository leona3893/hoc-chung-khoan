name: Bot tín hiệu crypto

# Quét các cặp thanh khoản nhất mỗi khi nến 4h đóng, mở vị thế GIẤY khi có tín hiệu,
# theo dõi tới khi chạm cắt lỗ / chốt lời / trailing / hết hạn giữ, rồi báo điểm bán.
# Không đặt lệnh, không giữ khoá API sàn — chỉ có token Telegram để gửi tin.

on:
  schedule:
    # Nến 4h đóng lúc 00,04,08,12,16,20 giờ UTC. Chạy sau 6 phút cho chắc nến đã chốt.
    - cron: "6 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi thử một tin mẫu kèm ảnh (nhập mã, vd BTC). Để trống = quét thật."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow chỉ để vẽ ảnh chart gửi kèm tín hiệu. Thiếu nó thì bot vẫn chạy,
      # chỉ gửi tin chữ.
      - name: Cài Pillow để vẽ chart
        run: pip install --quiet pillow

      - name: Quét tín hiệu crypto
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.test }}" ]; then
            python scripts/crypto_bot.py --test "${{ github.event.inputs.test }}"
          else
            python scripts/crypto_bot.py
          fi

      - name: Commit sổ nếu có thay đổi
        if: github.event.inputs.test == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-ideas.json
          if git diff --cached --quiet; then
            echo "Sổ không đổi."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "Sổ crypto $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
